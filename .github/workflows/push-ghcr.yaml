name: Deploy image to GHCR

on: 
  push:
    branches:
      - main
   
env:
  PAT: ${{ secrets.PAT  }}
    
permissions:
  contents: read
  packages: write
  
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v7 #Latest
      - name: Make script executable
        run: chmod +x src/performance.sh
      - name: Execute script
        run: sudo ./src/performance.sh 
      # - run: sudo apt update && sudo apt upgrade -y

  deploy-to-ghcr:
    needs: 
      - test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v7 #Latest
      - name: Login to Docker Hub
        uses: docker/login-action@v4.6.0 
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Image and Tag 
        run: docker build -t stats-perf -t ghcr.io/sharifndlovu123/stats-perf:latest .
      - name: Run Image
        if: success()
        run: docker run --rm stats-perf false
      - name: Push Image To GHCR
        if: success()
        run: docker push ghcr.io/sharifndlovu123/stats-perf:latest
  